[workspace]
members = ["player"]

[package]
name = "cosmic-ext-applet-spotify"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[dependencies]
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
libc = "0.2.189"
open = "5.4.4"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query", "rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["net", "time", "io-util", "sync", "macros", "rt", "process"] }
url = "2.5.8"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# libcosmic has no stable releases and its API changes often; bump deliberately.
rev = "1f6dc991eaa5115a09be2505cc8a323e5b2b0bff"
default-features = false
features = ["applet", "applet-token", "wayland", "tokio"]

[profile.release]
lto = "thin"

[dev-dependencies]
tempfile = "3.27.0"
