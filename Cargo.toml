[workspace]
members = ["player"]

[package]
name = "spotypop"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
description = "A Spotify mini player for the COSMIC panel"
repository = "https://github.com/gbazan92/spotypop"

[dependencies]
base64 = "0.23.1"
i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
libc = "0.2.189"
open = "5.4.4"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query", "rustls-no-provider"] }
rust-embed = "8"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["net", "time", "io-util", "sync", "macros", "rt", "process"] }
url = "2.5.8"

[dependencies.libcosmic]
# Same URL, no rev, as cosmic-panel-config asks for it: otherwise Cargo keeps two
# copies of libcosmic, which the offline Flatpak build cannot vendor side by side.
# Cargo.lock pins the commit; bump it deliberately with `cargo update -p libcosmic`.
git = "https://github.com/pop-os/libcosmic"
default-features = false
features = ["applet", "applet-token", "wayland", "tokio"]

[profile.release]
lto = "thin"

[dev-dependencies]
tempfile = "3.27.0"
